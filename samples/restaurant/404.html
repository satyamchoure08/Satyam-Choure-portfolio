<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found — Angeethi Kitchen, Bhopal</title>
  <meta name="description" content="This page has gone cold. Head back to Angeethi Kitchen to order or book a table.">
  <style>
    :root{--bg:#0E0B09;--ink:#F4EDE4;--ink-dim:#B9AC9E;--accent:#FF5A1F;--accent-ink:#1A0A03;--line:rgba(244,237,228,.14);--font-sans:"Inter",Helvetica,Arial,system-ui,sans-serif;--font-serif:"Playfair Display",Georgia,serif;--font-mono:ui-monospace,Menlo,Consolas,monospace}
    *{box-sizing:border-box}
    body{margin:0;min-height:100svh;background:var(--bg);color:var(--ink);font-family:var(--font-sans);display:grid;place-items:center;padding:24px;text-align:center}
    main{max-width:640px}
    .mono{font:500 11px/1.4 var(--font-mono);letter-spacing:.14em;text-transform:uppercase;color:#8A7E72}
    h1{font:700 clamp(4.5rem,22vw,12rem)/.85 var(--font-sans);letter-spacing:-.06em;margin:16px 0}
    h1 em{font-family:var(--font-serif);font-weight:400;color:var(--accent);letter-spacing:-.02em}
    p{color:var(--ink-dim);margin:0 0 28px}
    a.btn{display:inline-flex;align-items:center;min-height:48px;padding:14px 26px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:600;text-decoration:none;margin:6px}
    a.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <span class="mono">Error 404 — Angeethi Kitchen</span>
    <h1>Gone <em>cold.</em></h1>
    <p>This page has moved or never existed. The fire is still lit on the home page.</p>
    <a class="btn" href="index.html">Back to the menu</a>
    <a class="btn ghost" href="https://wa.me/919800000000?text=Hi%20Angeethi%2C%20I%27d%20like%20to%20order" target="_blank" rel="noopener">Order on WhatsApp</a>
  </main>
</body>
</html>
