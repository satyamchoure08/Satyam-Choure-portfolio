<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>www.numberGuessing.com</title>

  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>

  <header>

    <h1 class="mainHeading">
      Number Guessing Game
    </h1>
    <p class="aboutPara">
      <b class="welcome">Welcome,</b>
      Choose a number between 1 to 100. Let's see if you guess the correct answer. If your number is correct then you'll get "NOTHING", lol. THANKS, this game is built by <b class="satyamChoure">"SATYAM CHOURE"</b>. peace!!
    </p>
  </header>

  <main>

    <div class="formDiv">
      <label for="guessFeild">Enter a guess:</label>
      <input type="number" min="1" max="100" required
        id="guessFeild" class="guessFeild"
        placeholder="1-100">
      <button class="guessSubmit">SUBMIT</button>
    </div>

    <div class="resultParas">
      <p class="guesses"></p>
      <p class="lastResults"></p>
      <p class="lowOrHi"></p>
    </div>

  </main>
  
  <footer>
    
    <div class="profileCard">

    <div class="profileImage">
        <img src="../../images/satyamCropped.jpg" alt="Satyam Choure">
    </div>
    <div class="profileInfo">
        <span class="profileLabel">Satyam Choure</span>
        <h3>Web Developer</h3>
        <div class="profileLinks">
            <a href="https://x.com/satyamchoure08" target="_blank" rel="noopener noreferrer">X — @satyamchoure08</a>
            <a href="https://www.youtube.com/@SatyamChourex3k" target="_blank" rel="noopener noreferrer">YouTube — Satyam Choure x3k</a>
        </div>
    </div>

</div>
    
  </footer>
  
</body>

</html>
